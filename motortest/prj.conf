CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Robstride motors: classic CAN 2.0B only. FD mode off so no FD frame can
# ever go out on a motor bus (an FD frame counts as an error there).
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CAN_LOG_LEVEL_INF=y

CONFIG_MAIN_STACK_SIZE=2048

# printk %f for positions/temperatures
CONFIG_CBPRINTF_FP_SUPPORT=y
