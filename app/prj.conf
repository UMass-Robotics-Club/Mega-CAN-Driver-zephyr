CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=3072

# --- CAN: Robstride motors are classic CAN 2.0B only -----------------------
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=n

# --- Ethernet ----------------------------------------------------------------
# The Ethernet driver does no cache maintenance on packet buffers yet.
CONFIG_DCACHE=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_MDIO=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y

# Board = 192.168.10.2, Jetson = 192.168.10.1 (udp_protocol/README.md)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.10.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# No TRNG driver for this chip in Zephyr yet (ports/IDs only; not crypto).
CONFIG_TEST_RANDOM_GENERATOR=y

# Bench diagnostics on the UART: "net iface", "net stats", "can show can0"
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_CAN_SHELL=y

CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_INF=y
