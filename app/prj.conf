CONFIG_GPIO=y

# UART console (SERCOM0) for the heartbeat output.
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# CAN FD on can0 <-> can5 (externally bridged). The GPIO transceiver driver
# (TCAN1044AV standby pins) enables itself from the devicetree.
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# Driver diagnostics on the console while bringing CAN up.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CAN_LOG_LEVEL_INF=y
