CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# The Ethernet driver does no cache maintenance on packet buffers yet
# (upstream targeted a Cortex-M4 without a D-cache). See the driver header.
CONFIG_DCACHE=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_MDIO=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y

# Board = 192.168.10.2, Jetson/laptop = 192.168.10.1 (udp_protocol/README.md)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.10.1"
# don't hold boot waiting for a cable
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# Driver error counters (CRC, alignment, ...) = the gigabit timing check.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_ETHERNET=y

# "net iface", "net stats", "net ping 192.168.10.1" on the UART console
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_PHY_LOG_LEVEL_INF=y

# No TRNG entropy driver for PIC32CZ CA in Zephyr yet; the net stack needs
# random numbers for ports/IDs. Not cryptographic, fine on the robot's
# closed network. Replace when there's a TRNG driver.
CONFIG_TEST_RANDOM_GENERATOR=y
